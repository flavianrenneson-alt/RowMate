name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Build iOS target only
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -target RowMate \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          CONFIGURATION_BUILD_DIR=$(pwd)/build \
          SKIP_INSTALL=NO \
          2>&1 | tee build.log | tail -50

    - name: Check build output
      if: always()
      run: |
        echo "=== Checking build directory ==="
        ls -la build/ 2>/dev/null || echo "No build dir"
        echo "=== Looking for .app ==="
        find build -name "*.app" -type d 2>/dev/null || echo "No .app found"
        if [ -d "build/RowMate.app" ]; then
          echo "=== App contents ==="
          ls -la build/RowMate.app/
          echo "=== Info.plist ==="
          cat build/RowMate.app/Info.plist | head -30
        fi

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/RowMate.app Payload/
        zip -r RowMate.ipa Payload
        ls -la RowMate.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-IPA
        path: RowMate.ipa
