name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Build iOS app
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -target RowMate \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          2>&1 | tail -30

    - name: Find and prepare app bundle
      run: |
        echo "=== Finding RowMate.app ==="
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RowMate.app" -path "*/Release-iphoneos/*" -not -path "*/Watch/*" -type d 2>/dev/null | head -1)
        echo "Found: $APP_PATH"

        echo "=== App contents ==="
        ls -la "$APP_PATH/"

        echo "=== Checking executable ==="
        ls -la "$APP_PATH/RowMate" 2>/dev/null || echo "No executable"

        echo "=== Checking Info.plist ==="
        ls -la "$APP_PATH/Info.plist" 2>/dev/null || echo "No Info.plist"

        if [ ! -f "$APP_PATH/Info.plist" ]; then
          echo "Copying Info.plist..."
          sed -e 's/$(EXECUTABLE_NAME)/RowMate/g' \
              -e 's/$(PRODUCT_BUNDLE_IDENTIFIER)/com.flavian.RowMate/g' \
              -e 's/$(PRODUCT_NAME)/RowMate/g' \
              -e 's/$(PRODUCT_BUNDLE_PACKAGE_TYPE)/APPL/g' \
              RowMate/Info.plist > "$APP_PATH/Info.plist"
        fi

        echo "=== Final Info.plist ==="
        cat "$APP_PATH/Info.plist"

        # Save path for next step
        echo "$APP_PATH" > /tmp/app_path.txt

    - name: Build Watch app
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -target "RowMate Watch App" \
          -sdk watchos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          2>&1 | tail -30

    - name: Embed Watch app
      run: |
        APP_PATH=$(cat /tmp/app_path.txt)
        WATCH_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RowMate Watch App.app" -path "*/Release-watchos/*" -type d 2>/dev/null | head -1)

        if [ -n "$WATCH_PATH" ]; then
          echo "Watch app found: $WATCH_PATH"
          mkdir -p "$APP_PATH/Watch"
          cp -r "$WATCH_PATH" "$APP_PATH/Watch/"

          # Fix Watch Info.plist if missing
          WATCH_DEST="$APP_PATH/Watch/RowMate Watch App.app"
          if [ ! -f "$WATCH_DEST/Info.plist" ]; then
            sed -e 's/$(EXECUTABLE_NAME)/RowMate Watch App/g' \
                -e 's/$(PRODUCT_BUNDLE_IDENTIFIER)/com.flavian.RowMate.watchkitapp/g' \
                -e 's/$(PRODUCT_NAME)/RowMate Watch App/g' \
                -e 's/$(PRODUCT_BUNDLE_PACKAGE_TYPE)/APPL/g' \
                "RowMate Watch App/Info.plist" > "$WATCH_DEST/Info.plist"
          fi
          echo "Watch app embedded"
        else
          echo "Watch app not found, skipping"
        fi

    - name: Create IPA
      run: |
        APP_PATH=$(cat /tmp/app_path.txt)
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/

        echo "=== Verify IPA contents ==="
        ls -la Payload/RowMate.app/
        ls -la Payload/RowMate.app/RowMate 2>/dev/null && echo "Executable OK" || echo "NO EXECUTABLE"
        ls -la Payload/RowMate.app/Info.plist 2>/dev/null && echo "Info.plist OK" || echo "NO INFO.PLIST"

        zip -r RowMate.ipa Payload
        ls -la RowMate.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-IPA
        path: RowMate.ipa
