name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Build app
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -scheme RowMate \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          2>&1 | tee /tmp/build.log | tail -50
        echo "BUILD EXIT CODE: $?"

    - name: Show errors if any
      if: failure()
      run: grep -i "error:" /tmp/build.log | tail -20

    - name: Find app and verify
      run: |
        echo "=== Searching for RowMate.app ==="
        find ~/Library/Developer/Xcode/DerivedData -name "RowMate.app" -type d 2>/dev/null

        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RowMate.app" -path "*/Release-iphoneos/*" -type d 2>/dev/null | head -1)

        if [ -z "$APP_PATH" ]; then
          echo "Not found in Release-iphoneos, trying any location..."
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RowMate.app" -type d 2>/dev/null | head -1)
        fi

        echo "Using: $APP_PATH"
        echo "=== Full contents ==="
        ls -laR "$APP_PATH/" | head -50

        # HARD CHECK: executable MUST exist
        if [ ! -f "$APP_PATH/RowMate" ]; then
          echo "!!! EXECUTABLE MISSING !!!"
          echo "=== Build log errors ==="
          grep -i "error\|fail\|warning" /tmp/build.log | tail -30
          echo "=== DerivedData structure ==="
          find ~/Library/Developer/Xcode/DerivedData -name "RowMate" -type f 2>/dev/null | head -10
          exit 1
        fi

        echo "=== Executable OK ==="
        file "$APP_PATH/RowMate"

        # HARD CHECK: Info.plist MUST exist
        if [ ! -f "$APP_PATH/Info.plist" ]; then
          echo "Info.plist missing, creating..."
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string fr" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.flavian.RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist"
        fi
        echo "=== Info.plist OK ==="

        echo "$APP_PATH" > /tmp/app_path.txt

    - name: Create IPA
      run: |
        APP_PATH=$(cat /tmp/app_path.txt)
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/

        echo "=== FINAL VERIFICATION ==="
        echo "Executable:"
        ls -la Payload/RowMate.app/RowMate
        echo "Info.plist:"
        ls -la Payload/RowMate.app/Info.plist
        echo "All contents:"
        ls -la Payload/RowMate.app/

        zip -r RowMate-final.ipa Payload
        ls -la RowMate-final.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-FINAL-IPA
        path: RowMate-final.ipa
