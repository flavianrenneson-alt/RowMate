name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show available Xcode versions
      run: ls /Applications/ | grep Xcode

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: List schemes
      run: xcodebuild -project RowMate.xcodeproj -list

    - name: Build iOS app (unsigned)
      run: |
        xcodebuild \
          -project RowMate.xcodeproj \
          -scheme RowMate \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          build \
          CONFIGURATION_BUILD_DIR=$(pwd)/build

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/RowMate.app Payload/
        zip -r RowMate.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-IPA
        path: RowMate.ipa
