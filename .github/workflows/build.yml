name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Build iOS app
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -target RowMate \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          SYMROOT=$(pwd)/build-output \
          2>&1 | tail -30

    - name: Find app bundle
      run: |
        echo "=== All .app in build-output ==="
        find $(pwd)/build-output -name "*.app" -type d 2>/dev/null
        echo "=== All .app in DerivedData ==="
        find ~/Library/Developer/Xcode/DerivedData -name "RowMate.app" -type d 2>/dev/null
        echo "=== Release-iphoneos contents ==="
        find $(pwd)/build-output -path "*/Release-iphoneos" -type d 2>/dev/null | while read d; do
          echo "--- $d ---"
          ls -la "$d/"
        done

    - name: Prepare IPA
      run: |
        # Find the app - try build-output first, then DerivedData
        APP_PATH=$(find $(pwd)/build-output -name "RowMate.app" -type d 2>/dev/null | head -1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RowMate.app" -type d 2>/dev/null | head -1)
        fi

        if [ -z "$APP_PATH" ]; then
          echo "ERROR: RowMate.app not found anywhere!"
          exit 1
        fi

        echo "Using app: $APP_PATH"
        echo "=== Contents ==="
        ls -la "$APP_PATH/"

        # Check executable
        if [ -f "$APP_PATH/RowMate" ]; then
          echo "Executable found"
        else
          echo "ERROR: No executable in app bundle"
          exit 1
        fi

        # Fix Info.plist if missing
        if [ ! -f "$APP_PATH/Info.plist" ]; then
          echo "Adding Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string fr" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.flavian.RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string RowMate" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
          echo "Info.plist created"
        fi

        cat "$APP_PATH/Info.plist"

        # Create IPA
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r RowMate.ipa Payload
        echo "=== IPA created ==="
        ls -la RowMate.ipa
        echo "=== Verify ==="
        unzip -l RowMate.ipa | grep -E "(RowMate$|Info.plist)" | head -10

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-IPA
        path: RowMate.ipa
