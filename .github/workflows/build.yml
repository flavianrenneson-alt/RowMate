name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Archive iOS app
      run: |
        xcodebuild archive \
          -project RowMate.xcodeproj \
          -scheme RowMate \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -archivePath $PWD/build/RowMate.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          SKIP_INSTALL=NO \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Show archive contents
      run: |
        echo "=== Archive contents ==="
        find build/RowMate.xcarchive -name "*.app" -type d
        echo "=== App contents ==="
        APP=$(find build/RowMate.xcarchive/Products -name "*.app" -type d | head -1)
        ls -la "$APP/"
        echo "=== Info.plist check ==="
        cat "$APP/Info.plist" | head -20

    - name: Create IPA from archive
      run: |
        APP_PATH=$(find build/RowMate.xcarchive/Products -name "RowMate.app" -type d | head -1)
        echo "App path: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        echo "=== Payload contents ==="
        ls -la Payload/RowMate.app/
        zip -r RowMate.ipa Payload
        ls -la RowMate.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-IPA
        path: RowMate.ipa
