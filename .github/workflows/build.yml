name: Build RowMate IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version

    - name: Build Watch app (watchOS SDK)
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -target "RowMate Watch App" \
          -sdk watchos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          CONFIGURATION_BUILD_DIR=$(pwd)/build-watch \
          2>&1 | tail -30

    - name: Build iOS app (iphoneos SDK)
      run: |
        xcodebuild build \
          -project RowMate.xcodeproj \
          -target RowMate \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          CONFIGURATION_BUILD_DIR=$(pwd)/build-ios \
          2>&1 | tail -30

    - name: Embed Watch app in iOS app
      run: |
        mkdir -p "build-ios/RowMate.app/Watch"
        cp -r "build-watch/RowMate Watch App.app" "build-ios/RowMate.app/Watch/"
        echo "=== iOS app contents ==="
        ls -la build-ios/RowMate.app/
        echo "=== Watch folder ==="
        ls -la "build-ios/RowMate.app/Watch/"

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build-ios/RowMate.app Payload/
        zip -r RowMate.ipa Payload
        ls -la RowMate.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: RowMate-IPA
        path: RowMate.ipa
